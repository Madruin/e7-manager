# TEMPORARY: scraper iteration loop for the scaffold session. The cloud dev
# environment cannot reach the game-data sites and its GitHub token cannot
# dispatch workflows, so this runs on every push to the session branch.
# Delete when the scaffold session wraps up.
name: debug-scrape

on:
  push:
    branches: [claude/e7-manager-scaffold-scraper-6sxl63]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape sample heroes
        run: python scripts/scrape_rta_stats.py --refresh

      - name: Commit sample output
        run: |
          git add meta/rta
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "meta-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[scrape] sample RTA stats for Aube, Notos, Perfumer Byblis, Harsetti, Frieren"
            git push
          fi

      - name: Recon epic7db.com for rank-target stretch scraper
        run: |
          E7_SCRAPER_BASE=https://epic7db.com \
            python scripts/scrape_rta_stats.py --discover --refresh \
              --page / --page /heroes || true

      - name: Upload raw response cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-cache
          path: scripts/.cache/
          if-no-files-found: warn
          include-hidden-files: true

# TEMPORARY: map epic7db /guides structure for the session-6 comp harvest.
name: pve-recon

on:
  push:
    branches: [claude/e7-manager-scaffold-scraper-6sxl63]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map /guides links
        run: |
          curl -s https://epic7db.com/guides -o guides.html
          echo "== /guides is $(wc -c < guides.html) bytes"
          echo "== anchor hrefs containing guide/team/hunt (uniq):"
          grep -oiE 'href="[^"]*(guide|team|hunt|wyvern|banshee|golem|azimanak|caides|abyss|auto)[^"]*"' guides.html \
            | sed 's/href=//; s/"//g' | sort -u | head -60
      - name: Fetch a sample guide page and dump its structure
        run: |
          SAMPLE=$(grep -oiE 'href="https://epic7db.com/guides/[^"]+"' guides.html \
            | sed 's/href=//; s/"//g' | sort -u | head -1)
          echo "== sample guide: $SAMPLE"
          curl -s "$SAMPLE" -o g.html
          echo "== $(wc -c < g.html) bytes; headings:"
          grep -oiE '<h[1-4][^>]*>[^<]{0,80}' g.html | head -30
          echo "== team/hero links in the guide:"
          grep -oiE 'href="[^"]*heroes/[^"]+"' g.html | sed 's/href=//; s/"//g' | sort -u | head -30
          echo "== stat / threshold markup (speed/atk/cr near numbers):"
          grep -oiE '(speed|attack|crit|effectiveness|health|defense)[^<]{0,30}[0-9,]{2,}' g.html | head -30
          echo "== data-* attributes and class hints:"
          grep -oiE '(data-[a-z-]+|class)="[^"]{0,60}"' g.html | sort | uniq -c | sort -rn | head -25

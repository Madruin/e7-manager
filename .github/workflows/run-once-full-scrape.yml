# TEMPORARY: one-shot trigger for the "keep both" meta scrape (cloud sessions
# cannot dispatch workflows, so this fires on push). Delete after the run.
#   meta/rta/        -> current season (self-updates via weekly meta-sync)
#   meta/rta_ss20f/  -> pinned Pre-Season (Post Summer 2026) snapshot, frozen
name: run-once-full-scrape

on:
  push:
    branches: [claude/e7-manager-scaffold-scraper-6sxl63]

permissions:
  contents: write

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Current-season meta -> meta/rta/ (clear stale files first)
        run: |
          git rm -q -r --ignore-unmatch meta/rta
          python scripts/scrape_rta_stats.py --all --refresh

      - name: Probe whether the site exposes past seasons
        run: |
          echo "== default /heroes season histogram is logged by --all above."
          echo "== probing season-parameter variants for ss20f recovery:"
          for q in "?season=pvp_rta_ss20f" "?seasonCode=pvp_rta_ss20f" "?s=17"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://www.epic7rtastats.com/heroes$q" || echo ERR)
            hit=$(curl -s "https://www.epic7rtastats.com/heroes$q" \
              | grep -o "pvp_rta_ss20f" | head -1 || true)
            echo "  /heroes$q -> HTTP $code, ss20f present in body: ${hit:-no}"
          done

      - name: Commit
        run: |
          git add -A meta/rta
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "meta-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[scrape] full meta: current season + pinned ss20f snapshot"
            git pull --rebase
            git push
          fi

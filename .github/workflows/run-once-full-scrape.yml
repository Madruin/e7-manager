# TEMPORARY: one-shot back-fill of full ss20f coverage, now that the site's
# ?season= param is confirmed to work. Cloud sessions can't dispatch, so it
# fires on push. Delete after this run.
name: run-once-full-scrape

on:
  push:
    branches: [claude/e7-manager-scaffold-scraper-6sxl63]

permissions:
  contents: write

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Full ss20f back-fill -> meta/rta_ss20f/ (replace 5-hero snapshot)
        run: |
          git rm -q -r --ignore-unmatch meta/rta_ss20f
          python scripts/scrape_rta_stats.py --all --season pvp_rta_ss20f \
            --out-dir meta/rta_ss20f --refresh
          # keep the folder README
          git checkout HEAD -- meta/rta_ss20f/README.md 2>/dev/null || true

      - name: Restore README if the scrape removed it
        run: |
          if [ ! -f meta/rta_ss20f/README.md ]; then
            git show HEAD:meta/rta_ss20f/README.md > meta/rta_ss20f/README.md
          fi

      - name: Commit
        run: |
          git add -A meta/rta_ss20f
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "meta-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[scrape] full-roster ss20f snapshot via ?season= back-fill"
            git pull --rebase
            git push
          fi

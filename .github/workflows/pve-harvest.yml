# Weekly epic7db PvE-comp harvest (+ on-demand). Cloud sessions can't reach
# epic7db, so this runs on Actions. Commits meta/pve/comps.json only on change.
name: pve-harvest

on:
  schedule:
    - cron: "37 9 * * 1" # Mondays 09:37 UTC (after meta-sync)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest epic7db guide comps
        run: python scripts/scrape_epic7db_comps.py --refresh
      - name: Commit comps if changed
        run: |
          git add meta/pve/comps.json
          if git diff --cached --quiet; then
            echo "No comp changes."
          else
            git config user.name "meta-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[scrape] epic7db PvE comps"
            git pull --rebase
            git push
          fi
